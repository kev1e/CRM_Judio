[project]
name = "crm-api"
version = "0.0.0"
description = "CRM backend: Django + Django REST Framework (modular monolith)"
requires-python = ">=3.14"
dependencies = [
  "celery==5.7.0",
  "Django==6.1.3",
  "django-environ==0.14.0",
  "djangorestframework==3.18.3",
  "drf-spectacular==0.30.0",
  "gunicorn==27.0.0",
  "psycopg[binary]==3.3.9",
  "redis==8.1.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crm"
module-root = ""
