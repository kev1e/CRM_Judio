openapi: 3.0.3
info:
  title: CRM API
  version: 0.0.0
  description: Internal corporate CRM — HTTP API.
paths:
  /api/v1/auth/login:
    post:
      operationId: auth_login
      description: 'Step 1: check the login and password, ask for approval in Telegram.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStarted'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/login/complete:
    post:
      operationId: auth_login_complete
      description: |-
        Step 2, polled by the browser that started the attempt: where the approval
        stands; once approved, opens the session.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginProgress'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      description: |-
        Ends the current session and gives up a login attempt that is still
        waiting. Answers 204 even when there is neither, so that stale cookies are
        always removed.
      tags:
      - auth
      security:
      - sessionCookie: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me
      description: Who is signed in and what they may do right now.
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/password/setup:
    post:
      operationId: auth_password_setup
      description: |-
        The employee sets their first password with the one-time link from the bot.

        Does not sign anybody in: the normal login with approval in Telegram follows.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetupRequestRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/departments:
    get:
      operationId: departments_list
      tags:
      - departments
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: departments_create
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreateRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/departments/{department_id}:
    patch:
      operationId: departments_update
      parameters:
      - in: path
        name: department_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentUpdateRequest'
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/departments/{department_id}/managers:
    post:
      operationId: departments_add_manager
      parameters:
      - in: path
        name: department_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerAddRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/departments/{department_id}/managers/{user_id}:
    delete:
      operationId: departments_remove_manager
      parameters:
      - in: path
        name: department_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - departments
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/departments/{department_id}/members:
    post:
      operationId: departments_add_member
      parameters:
      - in: path
        name: department_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAddRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/departments/{department_id}/members/{user_id}:
    delete:
      operationId: departments_remove_member
      parameters:
      - in: path
        name: department_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - departments
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/health:
    get:
      operationId: health
      description: 'Liveness: the process is up. Touches no external dependency.'
      tags:
      - system
      security:
      - sessionCookie: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/ready:
    get:
      operationId: ready
      description: 'Readiness: PostgreSQL and Redis answer. Reports status only, never
        error text.'
      tags:
      - system
      security:
      - sessionCookie: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: ''
  /api/v1/users:
    get:
      operationId: users_list
      tags:
      - users
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: users_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequestRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/users/{user_id}/binding-code:
    post:
      operationId: users_binding_code
      description: Issues a fresh Telegram binding code; the previous one stops working.
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingCode'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/users/{user_id}/deactivate:
    post:
      operationId: users_deactivate
      description: 'Closes the account at once: sessions, pending codes and links
        end.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/users/{user_id}/reactivate:
    post:
      operationId: users_reactivate
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    BindingCode:
      type: object
      properties:
        code:
          type: string
          description: One-time Telegram binding code. Shown once.
        expires_at:
          type: string
          format: date-time
        command:
          type: string
          description: What the employee sends to the bot.
      required:
      - code
      - command
      - expires_at
    CheckResultEnum:
      enum:
      - ok
      - fail
      type: string
      description: |-
        * `ok` - ok
        * `fail` - fail
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        crm_login:
          type: string
        display_name:
          type: string
      required:
      - crm_login
      - display_name
      - id
    DeliveryEnum:
      enum:
      - pending
      - sent
      - failed
      type: string
      description: |-
        * `pending` - pending
        * `sent` - sent
        * `failed` - failed
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_active:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        managers:
          type: array
          items:
            $ref: '#/components/schemas/Manager'
      required:
      - id
      - is_active
      - managers
      - members
      - name
    DepartmentCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - name
    DepartmentList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Department'
      required:
      - results
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          nullable: true
      required:
      - code
      - details
      - message
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    LoginProgress:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/StateEnum'
        delivery:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/DeliveryEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - delivery
      - state
    LoginRequestRequest:
      type: object
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - login
      - password
    LoginStarted:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the attempt expires.
      required:
      - expires_at
      - expires_in
    Manager:
      type: object
      properties:
        id:
          type: string
          format: uuid
        crm_login:
          type: string
        display_name:
          type: string
        is_active:
          type: boolean
        is_designated:
          type: boolean
      required:
      - crm_login
      - display_name
      - id
      - is_active
      - is_designated
    ManagerAddRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        is_designated:
          type: boolean
          default: false
      required:
      - user_id
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        session:
          $ref: '#/components/schemas/SessionInfo'
        permissions:
          type: object
          additionalProperties:
            enum:
            - own
            - managed_departments
            - company
            type: string
            description: |-
              * `own` - own
              * `managed_departments` - managed_departments
              * `company` - company
          description: Permission code -> widest scope currently granted.
      required:
      - permissions
      - session
      - user
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        crm_login:
          type: string
        display_name:
          type: string
        is_active:
          type: boolean
        is_primary:
          type: boolean
      required:
      - crm_login
      - display_name
      - id
      - is_active
      - is_primary
    MemberAddRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        is_primary:
          type: boolean
          default: false
      required:
      - user_id
    NullEnum:
      enum:
      - null
    PasswordSetupRequestRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - password
      - token
    PatchedDepartmentUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        is_active:
          type: boolean
    Readiness:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReadinessStatusEnum'
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
      required:
      - checks
      - status
    ReadinessChecks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/CheckResultEnum'
        redis:
          $ref: '#/components/schemas/CheckResultEnum'
      required:
      - database
      - redis
    ReadinessStatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    SessionInfo:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
    StateEnum:
      enum:
      - pending
      - denied
      - expired
      - invalid
      - authenticated
      type: string
      description: |-
        * `pending` - pending
        * `denied` - denied
        * `expired` - expired
        * `invalid` - invalid
        * `authenticated` - authenticated
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        crm_login:
          type: string
        display_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        is_active:
          type: boolean
        telegram_bound:
          type: boolean
        has_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        departments:
          type: array
          items:
            $ref: '#/components/schemas/UserDepartment'
      required:
      - created_at
      - crm_login
      - departments
      - display_name
      - email
      - has_password
      - id
      - is_active
      - telegram_bound
    UserCreateRequestRequest:
      type: object
      properties:
        crm_login:
          type: string
          minLength: 1
          maxLength: 64
        display_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        department_id:
          type: string
          format: uuid
          nullable: true
      required:
      - crm_login
      - display_name
    UserCreated:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        binding:
          $ref: '#/components/schemas/BindingCode'
      required:
      - binding
      - user
    UserDepartment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_primary:
          type: boolean
        is_manager:
          type: boolean
      required:
      - id
      - is_manager
      - is_primary
      - name
    UserList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
      required:
      - results
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: crm_session
