components:
  schemas:
    BindingCode:
      type: object
      properties:
        code:
          type: string
          description: One-time Telegram binding code. Shown once.
        expires_at:
          type: string
          format: date-time
        command:
          type: string
          description: What the employee sends to the bot.
      required:
      - code
      - command
      - expires_at
    CategoryEnum:
      enum:
      - new
      - active
      - completed
      - cancelled
      type: string
      description: |-
        * `new` - New
        * `active` - Active
        * `completed` - Completed
        * `cancelled` - Cancelled
    CheckResultEnum:
      enum:
      - ok
      - fail
      type: string
      description: |-
        * `ok` - ok
        * `fail` - fail
    Checkpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        is_done:
          type: boolean
      required:
      - id
      - is_done
      - text
    CheckpointCreateRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - text
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        crm_login:
          type: string
        display_name:
          type: string
      required:
      - crm_login
      - display_name
      - id
    DeliveryEnum:
      enum:
      - pending
      - sent
      - failed
      type: string
      description: |-
        * `pending` - pending
        * `sent` - sent
        * `failed` - failed
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_active:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        managers:
          type: array
          items:
            $ref: '#/components/schemas/Manager'
      required:
      - id
      - is_active
      - managers
      - members
      - name
    DepartmentCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - name
    DepartmentList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Department'
      required:
      - results
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          nullable: true
      required:
      - code
      - details
      - message
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    HistoryEntry:
      type: object
      properties:
        occurred_at:
          type: string
          format: date-time
        action:
          type: string
        actor_name:
          type: string
      required:
      - action
      - actor_name
      - occurred_at
    LoginProgress:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/StateEnum'
        delivery:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/DeliveryEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - delivery
      - state
    LoginRequestRequest:
      type: object
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - login
      - password
    LoginStarted:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the attempt expires.
      required:
      - expires_at
      - expires_in
    Manager:
      type: object
      properties:
        id:
          type: string
          format: uuid
        crm_login:
          type: string
        display_name:
          type: string
        is_active:
          type: boolean
        is_designated:
          type: boolean
      required:
      - crm_login
      - display_name
      - id
      - is_active
      - is_designated
    ManagerAddRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        is_designated:
          type: boolean
          default: false
      required:
      - user_id
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        session:
          $ref: '#/components/schemas/SessionInfo'
        permissions:
          type: object
          additionalProperties:
            enum:
            - own
            - managed_departments
            - company
            type: string
            description: |-
              * `own` - own
              * `managed_departments` - managed_departments
              * `company` - company
          description: Permission code -> widest scope currently granted.
      required:
      - permissions
      - session
      - user
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        crm_login:
          type: string
        display_name:
          type: string
        is_active:
          type: boolean
        is_primary:
          type: boolean
      required:
      - crm_login
      - display_name
      - id
      - is_active
      - is_primary
    MemberAddRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        is_primary:
          type: boolean
          default: false
      required:
      - user_id
    Named:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    NullEnum:
      enum:
      - null
    Options:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Named'
      required:
      - results
    PasswordSetupRequestRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - password
      - token
    PatchedCheckpointUpdateRequest:
      type: object
      properties:
        is_done:
          type: boolean
    PatchedDepartmentUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        is_active:
          type: boolean
    PatchedTaskUpdateRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
          description: The version the client edited.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 20000
        due_at:
          type: string
          format: date-time
          nullable: true
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        assignee_id:
          type: string
          format: uuid
    PatchedWorkflowStatusUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        next_status_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
    PriorityEnum:
      enum:
      - low
      - normal
      - high
      - urgent
      type: string
      description: |-
        * `low` - Low
        * `normal` - Normal
        * `high` - High
        * `urgent` - Urgent
    Readiness:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReadinessStatusEnum'
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
      required:
      - checks
      - status
    ReadinessChecks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/CheckResultEnum'
        redis:
          $ref: '#/components/schemas/CheckResultEnum'
      required:
      - database
      - redis
    ReadinessStatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    SessionInfo:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
    StateEnum:
      enum:
      - pending
      - denied
      - expired
      - invalid
      - authenticated
      type: string
      description: |-
        * `pending` - pending
        * `denied` - denied
        * `expired` - expired
        * `invalid` - invalid
        * `authenticated` - authenticated
    Status:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        position:
          type: integer
        next_status_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Statuses a task may be moved to from this one.
      required:
      - category
      - id
      - name
      - next_status_ids
      - position
    StatusList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Status'
      required:
      - results
    TaskActions:
      type: object
      properties:
        edit:
          type: boolean
        status:
          type: boolean
        deadline:
          type: boolean
        checkpoints_use:
          type: boolean
        checkpoints_manage:
          type: boolean
        priority:
          type: boolean
        reassign:
          type: boolean
        archive:
          type: boolean
        delete:
          type: boolean
      required:
      - archive
      - checkpoints_manage
      - checkpoints_use
      - deadline
      - delete
      - edit
      - priority
      - reassign
      - status
    TaskCard:
      type: object
      description: Exactly what a card on the board shows (D005).
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        task_type:
          $ref: '#/components/schemas/TaskTypeEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status_id:
          type: string
          format: uuid
        due_at:
          type: string
          format: date-time
          nullable: true
        department:
          $ref: '#/components/schemas/Named'
        assignee:
          $ref: '#/components/schemas/Named'
        checkpoints_done:
          type: integer
        checkpoints_total:
          type: integer
        is_completed:
          type: boolean
        is_archived:
          type: boolean
        is_deleted:
          type: boolean
        version:
          type: integer
      required:
      - assignee
      - checkpoints_done
      - checkpoints_total
      - department
      - due_at
      - id
      - is_archived
      - is_completed
      - is_deleted
      - priority
      - status_id
      - task_type
      - title
      - version
    TaskCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          default: ''
          maxLength: 20000
        department_id:
          type: string
          format: uuid
        assignee_id:
          type: string
          format: uuid
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: normal
        due_at:
          type: string
          format: date-time
          nullable: true
        task_type:
          allOf:
          - $ref: '#/components/schemas/TaskTypeEnum'
          default: task
      required:
      - assignee_id
      - department_id
      - title
    TaskCreated:
      type: object
      description: A receipt. `task` is present only if the creator may read what
        they created (Q02).
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        task:
          allOf:
          - $ref: '#/components/schemas/TaskDetail'
          nullable: true
      required:
      - id
      - task
      - title
    TaskDetail:
      type: object
      description: Exactly what a card on the board shows (D005).
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        task_type:
          $ref: '#/components/schemas/TaskTypeEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status_id:
          type: string
          format: uuid
        due_at:
          type: string
          format: date-time
          nullable: true
        department:
          $ref: '#/components/schemas/Named'
        assignee:
          $ref: '#/components/schemas/Named'
        checkpoints_done:
          type: integer
        checkpoints_total:
          type: integer
        is_completed:
          type: boolean
        is_archived:
          type: boolean
        is_deleted:
          type: boolean
        version:
          type: integer
        description:
          type: string
        author:
          $ref: '#/components/schemas/Named'
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        checkpoints:
          type: array
          items:
            $ref: '#/components/schemas/Checkpoint'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
        actions:
          allOf:
          - $ref: '#/components/schemas/TaskActions'
          description: What the interface may offer. Every operation is checked again
            by the server.
      required:
      - actions
      - assignee
      - author
      - checkpoints
      - checkpoints_done
      - checkpoints_total
      - completed_at
      - created_at
      - department
      - description
      - due_at
      - history
      - id
      - is_archived
      - is_completed
      - is_deleted
      - priority
      - status_id
      - task_type
      - title
      - version
    TaskList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TaskCard'
      required:
      - results
    TaskTypeEnum:
      enum:
      - task
      - request
      type: string
      description: |-
        * `task` - Task
        * `request` - Request
    TransitionRequest:
      type: object
      properties:
        status_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          nullable: true
      required:
      - status_id
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        crm_login:
          type: string
        display_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        is_active:
          type: boolean
        telegram_bound:
          type: boolean
        has_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        departments:
          type: array
          items:
            $ref: '#/components/schemas/UserDepartment'
      required:
      - created_at
      - crm_login
      - departments
      - display_name
      - email
      - has_password
      - id
      - is_active
      - telegram_bound
    UserCreateRequestRequest:
      type: object
      properties:
        crm_login:
          type: string
          minLength: 1
          maxLength: 64
        display_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        department_id:
          type: string
          format: uuid
          nullable: true
      required:
      - crm_login
      - display_name
    UserCreated:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        binding:
          $ref: '#/components/schemas/BindingCode'
      required:
      - binding
      - user
    UserDepartment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_primary:
          type: boolean
        is_manager:
          type: boolean
      required:
      - id
      - is_manager
      - is_primary
      - name
    UserList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
      required:
      - results
    Workflow:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStatus'
      required:
      - results
    WorkflowOrderRequest:
      type: object
      properties:
        status_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
      required:
      - status_ids
    WorkflowRetireRequest:
      type: object
      properties:
        replacement_id:
          type: string
          format: uuid
          nullable: true
          description: Required when tasks use the status. Never chosen automatically.
    WorkflowStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        position:
          type: integer
        next_status_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Statuses a task may be moved to from this one.
        is_active:
          type: boolean
          description: False for a retired status.
        task_count:
          type: integer
          description: 'How many tasks have this status now. A number only: no task
            is shown.'
      required:
      - category
      - id
      - is_active
      - name
      - next_status_ids
      - position
      - task_count
    WorkflowStatusCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          $ref: '#/components/schemas/CategoryEnum'
      required:
      - category
      - name
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: crm_session
