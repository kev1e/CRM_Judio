        has_unpublished_changes:
          type: boolean
        versions:
          type: array
          items:
            $ref: '#/components/schemas/TemplateVersion'
          description: Newest first. Immutable.
      required:
      - departments
      - description
      - draft_checkpoints
      - draft_fields
      - has_unpublished_changes
      - id
      - is_active
      - name
      - versions
    TemplateCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          default: ''
          maxLength: 500
      required:
      - name
    TemplateList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Template'
      required:
      - results
    TemplateVersion:
      type: object
      properties:
        number:
          type: integer
        published_at:
          type: string
          format: date-time
        published_by:
          type: string
          description: Name of who published it.
        form_fields:
          type: array
          items:
            type: object
            additionalProperties: {}
        checkpoints:
          type: array
          items:
            type: string
      required:
      - checkpoints
      - form_fields
      - number
      - published_at
      - published_by
    TransitionRequest:
      type: object
      properties:
        status_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          nullable: true
      required:
      - status_id
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        crm_login:
          type: string
        display_name:
          type: string
        responsibility:
          type: string
        email:
          type: string
          format: email
          nullable: true
        is_active:
          type: boolean
        telegram_bound:
          type: boolean
        has_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        departments:
          type: array
          items:
            $ref: '#/components/schemas/UserDepartment'
      required:
      - created_at
      - crm_login
      - departments
      - display_name
      - email
      - has_password
      - id
      - is_active
      - responsibility
      - telegram_bound
    UserCreateRequestRequest:
      type: object
      properties:
        crm_login:
          type: string
          minLength: 1
          maxLength: 64
        display_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        department_id:
          type: string
          format: uuid
          nullable: true
      required:
      - crm_login
      - display_name
    UserCreated:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        binding:
          $ref: '#/components/schemas/BindingCode'
      required:
      - binding
      - user
    UserDepartment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_primary:
          type: boolean
        is_manager:
          type: boolean
      required:
      - id
      - is_manager
      - is_primary
      - name
    UserList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
      required:
      - results
    Workflow:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStatus'
      required:
      - results
    WorkflowOrderRequest:
      type: object
      properties:
        status_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
      required:
      - status_ids
    WorkflowRetireRequest:
      type: object
      properties:
        replacement_id:
          type: string
          format: uuid
          nullable: true
          description: Required when tasks use the status. Never chosen automatically.
    WorkflowStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        position:
          type: integer
        next_status_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Statuses a task may be moved to from this one.
        show_project:
          type: boolean
          description: Whether cards in this column show their project.
        group_by_project:
          type: boolean
          description: Whether the column is divided into folded lists by project.
        is_active:
          type: boolean
          description: False for a retired status.
        task_count:
          type: integer
          description: 'How many tasks have this status now. A number only: no task
            is shown.'
      required:
      - category
      - group_by_project
      - id
      - is_active
      - name
      - next_status_ids
      - position
      - show_project
      - task_count
    WorkflowStatusCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          $ref: '#/components/schemas/CategoryEnum'
        show_project:
          type: boolean
          default: true
        group_by_project:
          type: boolean
          default: false
      required:
      - category
      - name
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: crm_session
