# Full local stack: `docker compose up --build --wait`.
# Requires `.env` (see `.env.example` or run `sh scripts/init-env.sh`).
name: crm

x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile
  image: crm-backend:local
  environment: &backend-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    # `api` is the host name the web container uses inside the compose network.
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},api
    DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
    REDIS_URL: redis://redis:6379/0
    # Empty token: the stack runs, but nobody can sign in (a login needs the bot).
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
    WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://127.0.0.1:3000}
    NOTIFICATION_TIME_ZONE: ${NOTIFICATION_TIME_ZONE:-Europe/Moscow}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    # Attachments (D039). "local" keeps files in the crm-files volume and is for
    # trying the stack out; production sets FILE_STORAGE=s3 and the S3 settings.
    FILE_STORAGE: ${FILE_STORAGE:-local}
    FILE_STORAGE_LOCAL_ROOT: /var/lib/crm/files
    FILE_UPLOAD_TEMP_DIR: /var/lib/crm/upload-tmp
    FILE_STORAGE_S3_ENDPOINT_URL: ${FILE_STORAGE_S3_ENDPOINT_URL:-}
    FILE_STORAGE_S3_REGION: ${FILE_STORAGE_S3_REGION:-}
    FILE_STORAGE_S3_BUCKET: ${FILE_STORAGE_S3_BUCKET:-}
    FILE_STORAGE_S3_ACCESS_KEY_ID: ${FILE_STORAGE_S3_ACCESS_KEY_ID:-}
    FILE_STORAGE_S3_SECRET_ACCESS_KEY: ${FILE_STORAGE_S3_SECRET_ACCESS_KEY:-}
  networks: [internal]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    # Append-only file: queued tasks survive a container restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # One-off job: applies migrations, then exits. API and worker wait for it.
  migrate:
    <<: *backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Uploads in progress and, with FILE_STORAGE=local, the files themselves.
    # The container's own filesystem is read-only and /tmp is memory.
    volumes:
      - crm-files:/var/lib/crm
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *backend
    command:
      ["celery", "--app", "crm_worker.app", "worker", "--loglevel", "INFO", "--concurrency", "2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --app crm_worker.app inspect ping --destination celery@$$HOSTNAME --timeout 5",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # The Telegram bot (long polling). It needs TELEGRAM_BOT_TOKEN in `.env` and
  # starts only with the `telegram` profile, so the default stack runs without it:
  #   docker compose --profile telegram up --build --wait
  bot:
    <<: *backend
    profiles: [telegram]
    command: ["python", "-m", "crm_bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Files of requests made in the bot go to the same storage as the API's.
    volumes:
      - crm-files:/var/lib/crm
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: crm-web:local
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [internal]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  internal:

volumes:
  crm-files:
  postgres-data:
  redis-data:
